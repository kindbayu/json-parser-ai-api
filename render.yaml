services:
  - type: web
    name: ai-engine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python data_gen.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./data/chroma_db
      - key: APP_TITLE
        value: AI Engine API
      - key: APP_VERSION
        value: 3.0.0
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false   # set manually in Render dashboard
      - key: API_KEY
        sync: false   # optional: protect endpoints (X-API-Key header)
